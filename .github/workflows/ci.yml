# Path: .github/workflows/ci.yml
# Purpose: Gate every change quickly, while scheduled/manual CI retains full breadth.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 1 * * *"

permissions:
  contents: read

jobs:
  fast:
    name: fast safety gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run curated fast gate
        run: python -m pytest -m fast

  full:
    name: full scheduled suite
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python and Lua test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install lupa
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lua5.4

      - name: Run complete suite
        run: python -m pytest

  lua:
    name: lua syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Anything in the mod that touches the game API can only be parsed here;
      # a syntax error would otherwise stay invisible until a live run failed to
      # start. luac -p parses without executing and does NOT resolve globals, so
      # a call to a deleted Lua helper still only surfaces in game. The parts
      # that are pure table logic are pulled out into their own modules and run
      # for real under lupa in the pytest job above.
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends lua5.4

      - name: Check factorio_mod/*.lua parses
        run: |
          status=0
          for file in factorio_mod/*.lua; do
            if luac5.4 -p "$file"; then
              echo "ok   $file"
            else
              echo "FAIL $file"
              status=1
            fi
          done
          exit $status
