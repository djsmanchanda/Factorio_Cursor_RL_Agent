# Path: .github/workflows/ci.yml
# Purpose: Gate every change on the Python test suite and Lua syntax validation, so a
#          defect is caught here instead of mid-build against a real Factorio server.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Verification-only, deliberately out of requirements.txt: the game ships
      # its own interpreter, so nothing at runtime needs one. lupa embeds Lua so
      # the mod's pure logic can be driven by pytest instead of only parsed.
      # Without it those tests skip and the Lua regressions go unnoticed.
      - name: Install Lua test interpreter
        run: pip install lupa

      - name: Run test suite
        run: python -m pytest

  lua:
    name: lua syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Anything in the mod that touches the game API can only be parsed here;
      # a syntax error would otherwise stay invisible until a live run failed to
      # start. luac -p parses without executing and does NOT resolve globals, so
      # a call to a deleted Lua helper still only surfaces in game. The parts
      # that are pure table logic are pulled out into their own modules and run
      # for real under lupa in the pytest job above.
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends lua5.4

      - name: Check factorio_mod/*.lua parses
        run: |
          status=0
          for file in factorio_mod/*.lua; do
            if luac5.4 -p "$file"; then
              echo "ok   $file"
            else
              echo "FAIL $file"
              status=1
            fi
          done
          exit $status
