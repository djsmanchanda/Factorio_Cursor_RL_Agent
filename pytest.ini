# Path: pytest.ini | Purpose: Keep routine verification concise while retaining actionable failures.
[pytest]
addopts = -qq --tb=line --disable-warnings --strict-markers
console_output_style = count
pythonpath = .
markers =
    fast: curated safety-oriented gate intended to finish quickly on every change
    contracts: schemas, catalogs, pure planners, validators, and invariant contracts
    deterministic: mocked or replayed deterministic-controller behavior and recovery
    training: disposable RL scenarios, rewards, policies, and training contracts
    ops: dashboards, runners, shell managers, logging, retention, and operator tooling
    slow: expensive breadth retained outside the per-change fast gate
    exhaustive: full seeded or repeated determinism sweep reserved for scheduled/manual runs
    lua: requires Lua execution or validates generated/mod Lua behavior
    loopback: binds a local socket and may require sandbox permission
    integration: crosses a process, interpreter, HTTP, CLI, or replay boundary
    source_tripwire: implementation/source-text assertion; never lifecycle acceptance evidence
    live_regression: exact recorded live-failure regression reproduced offline
